<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roll Color Dice</title>
    <style>
        body {
            background-color: #5ab2ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            overflow: hidden;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 0px #000;
            font-size: 2.5em;
            margin-bottom: 20px;
            font-family: 'Comic Sans MS', sans-serif;
        }

        .dice-container {
            display: flex;
            gap: 20px;
            margin: 30px 0;
            position: relative;
        }

        .die {
            width: 120px;
            height: 120px;
            background-color: #fff;
            border-radius: 15px;
            border: 6px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.1s;
        }

        .die .dot {
            width: 25px;
            height: 25px;
            background-color: white;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(0,0,0,0.3);
        }

        @keyframes tremble {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-3px, 3px) rotate(-3deg); }
            50% { transform: translate(3px, -3px) rotate(3deg); }
            75% { transform: translate(-3px, -3px) rotate(-2deg); }
            100% { transform: translate(3px, 3px) rotate(2deg); }
        }

        .suspense {
            animation: tremble 0.08s infinite;
            background-color: #ffffff !important;
        }

        .pop {
            transform: scale(1.2);
        }

        button {
            background-color: #ffd700;
            color: white;
            border: 4px solid white;
            border-radius: 8px;
            padding: 15px 50px;
            font-size: 1.8em;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            text-shadow: 1px 1px 2px #d4af37, -1px -1px 0 #d4af37, 1px -1px 0 #d4af37, -1px 1px 0 #d4af37;
            margin-bottom: 20px;
            transition: transform 0.05s;
            z-index: 10;
        }

        button:active {
            transform: translateY(4px) scale(0.95);
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .colors-info {
            background-color: rgba(255, 255, 255, 0.4);
            padding: 10px 20px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            font-size: 1.1em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        #combo-display {
            position: absolute;
            top: 230px;
            font-size: 5em;
            color: #ff2a2a;
            font-weight: 900;
            font-family: 'Comic Sans MS', sans-serif;
            text-transform: uppercase;
            text-shadow: 4px 4px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
        }

        .show-combo {
            animation: popCombo 0.3s forwards;
        }

        @keyframes popCombo {
            0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
            50% { opacity: 1; transform: scale(1.4) rotate(10deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
    </style>
</head>
<body>

    <h1>ROLL COLOR DICE</h1>

    <div class="dice-container">
        <div class="die" id="die1"><div class="dot"></div></div>
        <div class="die" id="die2"><div class="dot"></div></div>
        <div class="die" id="die3"><div class="dot"></div></div>
    </div>

    <div id="combo-display"></div>

    <button id="rollBtn" onclick="startRollAnimation()">ROLL AGAIN !</button>

    <div class="colors-info">
        Possible colors are: 
        <span style="color: #ff0000;">Red</span>, 
        <span style="color: #ffa500;">Orange</span>, 
        <span style="color: #ffff00;">Yellow</span>, 
        <span style="color: #008000;">Green</span>, 
        <span style="color: #0000ff;">Blue</span> and 
        <span style="color: #800080;">Purple</span>.
    </div>

    <script>
        const colors = ['#ff0000', '#ffa500', '#ffff00', '#008000', '#0000ff', '#800080'];
        
        let rollTimeout;
        let comboTimeout;
        let comboCount = 0;

        function startRollAnimation() {
            comboCount++;
            const comboEl = document.getElementById('combo-display');
            
            if (comboCount > 1) {
                comboEl.innerText = "COMBO x" + comboCount + " !";
                comboEl.classList.remove('show-combo');
                void comboEl.offsetWidth; 
                comboEl.classList.add('show-combo');
                comboEl.style.opacity = '1';
            }

            clearTimeout(comboTimeout);
            comboTimeout = setTimeout(() => {
                comboEl.classList.remove('show-combo');
                comboEl.style.opacity = '0';
                comboCount = 0;
            }, 1500);

            for (let i = 1; i <= 3; i++) {
                const dieElement = document.getElementById('die' + i);
                dieElement.style.backgroundColor = '#ffffff'; 
                dieElement.classList.add('suspense');
            }

            clearTimeout(rollTimeout);
            rollTimeout = setTimeout(finalizeRoll, 1000); 
        }

        function finalizeRoll() {
            for (let i = 1; i <= 3; i++) {
                const dieElement = document.getElementById('die' + i);
                dieElement.classList.remove('suspense');
                
                const finalRandomIndex = Math.floor(Math.random() * colors.length);
                dieElement.style.backgroundColor = colors[finalRandomIndex];

                dieElement.classList.add('pop');
                setTimeout(() => {
                    dieElement.classList.remove('pop'); 
                }, 300);
            }
        }

        window.onload = () => {
            startRollAnimation();
            comboCount = 0; 
            document.getElementById('combo-display').style.opacity = '0';
        };
    </script>

</body>
</html>
