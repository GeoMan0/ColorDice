<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roll Color Dice</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5655926023636540" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding-top: 50px;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease;
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        body.theme-default { background-image: linear-gradient(-45deg, #5ab2ff, #2980b9, #6dd5ed, #2193b0); }
        body.theme-green { background-image: linear-gradient(-45deg, #11998e, #38ef7d, #00b09b, #96c93d); }
        body.theme-red { background-image: linear-gradient(-45deg, #cb2d3e, #ef473a, #ff0844, #ffb199); }
        body.theme-bw { background-image: linear-gradient(-45deg, #232526, #414345, #000000, #434343); }
        body.theme-bronze { background-image: linear-gradient(-45deg, #cd7f32, #8b5a2b, #a0522d, #cd853f); }
        body.theme-silver { background-image: linear-gradient(-45deg, #bdc3c7, #2c3e50, #8e9eab, #eef2f3); }
        body.theme-gold { background-image: linear-gradient(-45deg, #ffd700, #daa520, #b8860b, #ffdf00); }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
            font-size: 3em;
            margin-bottom: 10px;
            font-family: 'Comic Sans MS', sans-serif;
            letter-spacing: 2px;
        }

        .header-right {
            position: absolute;
            top: 20px;
            right: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 200;
        }

        .server-text {
            color: white;
            font-weight: 800;
            font-size: 1.2em;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .server-text small {
            font-size: 0.6em;
            font-weight: 500;
            opacity: 0.9;
        }

        .discord-btn {
            background-color: #5865F2;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
        }

        .discord-btn:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 6px 14px rgba(0,0,0,0.4);
        }

        .discord-btn svg { width: 26px; height: 26px; fill: white; }

        /* ========== WATERMARK AMÉLIORÉ ========== */
        .watermark {
            position: fixed;
            bottom: 20px;
            right: 25px;
            color: rgba(255, 255, 255, 0.95);
            font-family: 'Orbitron', monospace;
            font-size: 1.15em;
            font-weight: 700;
            font-style: normal;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 200;
            text-shadow:
                0 0 6px rgba(255,255,255,0.9),
                0 0 14px rgba(255,255,255,0.7),
                0 0 28px rgba(255,255,255,0.5),
                0 0 50px rgba(200,220,255,0.4);
            animation: glowPulse 2.5s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% {
                text-shadow:
                    0 0 6px rgba(255,255,255,0.9),
                    0 0 14px rgba(255,255,255,0.7),
                    0 0 28px rgba(255,255,255,0.5),
                    0 0 50px rgba(200,220,255,0.4);
                opacity: 1;
            }
            50% {
                text-shadow:
                    0 0 10px rgba(255,255,255,1),
                    0 0 22px rgba(255,255,255,0.9),
                    0 0 45px rgba(255,255,255,0.7),
                    0 0 80px rgba(200,220,255,0.6);
                opacity: 0.85;
            }
        }

        /* ========== CONTROLS AMÉLIORÉS ========== */
        .controls-top {
            display: flex;
            gap: 14px;
            margin-bottom: 30px;
            padding: 14px 22px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.15);
        }

        .select-wrapper { position: relative; display: inline-block; }
        .select-wrapper::after {
            content: '▾'; position: absolute; right: 13px; top: 50%;
            transform: translateY(-50%); color: rgba(255,255,255,0.7);
            font-size: 1em; pointer-events: none; transition: transform 0.2s ease;
        }
        .select-wrapper:hover::after { transform: translateY(-50%) translateY(2px); }

        select {
            appearance: none; -webkit-appearance: none; padding: 11px 40px 11px 16px;
            font-family: 'Orbitron', monospace; font-size: 0.72em; font-weight: 700;
            letter-spacing: 1px; border-radius: 10px; border: 2px solid rgba(255, 255, 255, 0.45);
            background: rgba(255, 255, 255, 0.12); color: #ffffff; cursor: pointer;
            outline: none; text-transform: uppercase; transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.18);
            min-width: 200px;
        }

        select:hover {
            background: rgba(255, 255, 255, 0.22); border-color: rgba(255, 255, 255, 0.75);
            box-shadow: 0 6px 20px rgba(0,0,0,0.25), 0 0 12px rgba(255,255,255,0.15), inset 0 1px 0 rgba(255,255,255,0.25);
            transform: translateY(-1px);
        }

        select:focus {
            border-color: #ffd700; box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.3), 0 6px 20px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        select option { background-color: #1a1a2e; color: white; font-family: 'Rajdhani', sans-serif; font-weight: 600; }
        select option:disabled { color: #888; }
        
        .select-group { display: flex; flex-direction: column; gap: 5px; }
        .select-label {
            font-family: 'Orbitron', monospace; font-size: 0.58em; font-weight: 700;
            color: rgba(255,255,255,0.6); letter-spacing: 2px; text-transform: uppercase; padding-left: 4px;
        }

        /* ========== DÉS ========== */
        .dice-container {
            display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
            gap: 15px; margin: 20px 0; width: 90%; max-width: 900px; min-height: 150px; position: relative;
        }

        .die {
            width: 100px; height: 100px; background-color: #fff; border-radius: 15px;
            border: 6px solid white; box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.1s;
        }

        .die.medium { width: 60px; height: 60px; border-width: 4px; border-radius: 10px; }
        .die.small { width: 40px; height: 40px; border-width: 3px; border-radius: 8px; }

        .die .dot { width: 22%; height: 22%; background-color: white; border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.3); }

        @keyframes tremble {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-3px, 3px) rotate(-3deg); }
            50% { transform: translate(3px, -3px) rotate(3deg); }
            75% { transform: translate(-3px, -3px) rotate(-2deg); }
            100% { transform: translate(3px, 3px) rotate(2deg); }
        }

        .suspense { animation: tremble 0.08s infinite; background-color: #ffffff !important; }
        .pop { transform: scale(1.2); }

        button#rollBtn {
            background-color: #ffd700; color: white; border: 4px solid white; border-radius: 8px;
            padding: 15px 50px; font-size: 2em; font-weight: 900; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-shadow: 1px 1px 2px #d4af37, -1px -1px 0 #d4af37, 1px -1px 0 #d4af37, -1px 1px 0 #d4af37;
            margin-bottom: 20px; margin-top: 30px; transition: all 0.1s; z-index: 10;
        }

        button#rollBtn:active:not(:disabled) { transform: translateY(4px) scale(0.95); box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        button#rollBtn:disabled { background-color: #bdc3c7; text-shadow: none; border-color: #95a5a6; cursor: not-allowed; transform: scale(0.95); }

        .colors-info {
            background-color: rgba(255, 255, 255, 0.3); padding: 10px 20px; border-radius: 5px;
            color: white; font-weight: bold; font-size: 1.1em; text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px); margin-bottom: 20px; z-index: 10;
        }

        #combo-display {
            position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
            font-size: 4em; color: #ff2a2a; font-weight: 900; font-family: 'Comic Sans MS', sans-serif;
            text-transform: uppercase; text-shadow: 3px 3px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
            opacity: 0; pointer-events: none; z-index: 100; white-space: nowrap;
        }

        .show-combo { animation: popCombo 0.3s forwards; }

        @keyframes popCombo {
            0% { opacity: 0; transform: translateX(-50%) scale(0.3) rotate(-5deg); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.2) rotate(3deg); }
            100% { opacity: 1; transform: translateX(-50%) scale(1) rotate(0deg); }
        }

        /* ========== SPOTS PUBLICITAIRES RÉELS ========== */
        .ad-space {
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .ad-side {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 160px;
            height: 600px;
        }
        .ad-left { left: 10px; }
        .ad-right { right: 10px; }

        .ad-bottom {
            width: 728px;
            max-width: 90%;
            height: 90px;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        @media (max-width: 1200px) {
            .ad-side { display: none; } /* Cache les publicités latérales sur les petits écrans pour ne pas gêner le jeu */
        }
    </style>
</head>

    <h1>ROLL COLOR DICE</h1>
    
    <div class="controls-top">
        <div class="select-group">
            <span class="select-label">🎨 Theme</span>
            <div class="select-wrapper">
                <select id="themeSelect" onchange="changeTheme()">
                    <option value="default">DEFAULT</option>
                    <option value="green">GREEN</option>
                    <option value="red">RED</option>
                    <option value="bw">B&W</option>
                    <option value="bronze" id="opt-bronze" disabled>BRONZE 🔒</option>
                    <option value="silver" id="opt-silver" disabled>SILVER 🔒</option>
                    <option value="gold" id="opt-gold" disabled>GOLD 🔒</option>
                </select>
            </div>
        </div>
        <div class="select-group">
            <span class="select-label">🎲 Number of Dice</span>
            <div class="select-wrapper">
                <select id="diceCountSelect" onchange="generateDice()"></select>
            </div>
        </div>
    </div>

    <div class="dice-container" id="diceContainer">
        <div id="combo-display"></div>
    </div>

    <button id="rollBtn" onclick="startRollAnimation()">ROLL AGAIN !</button>

    <div class="colors-info">
        Possible colors are: 
        <span style="color: #ff0000;">Red</span>, 
        <span style="color: #ffa500;">Orange</span>, 
        <span style="color: #ffff00;">Yellow</span>, 
        <span style="color: #008000;">Green</span>, 
        <span style="color: #0000ff;">Blue</span> and 
        <span style="color: #800080;">Purple</span>.
    </div>

    <div class="watermark">Created by Retox &amp; Geoman</div>

    <script>
        const colors = ['#ff0000', '#ffa500', '#ffff00', '#008000', '#0000ff', '#800080'];
        let totalRolls = 0;
        let comboCount = 0;
        let spamTimeout;

        const countSelect = document.getElementById('diceCountSelect');
        for(let i = 1; i <= 50; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.innerHTML = i + (i === 1 ? ' DIE' : ' DICE');
            if(i === 3) opt.selected = true;
            countSelect.appendChild(opt);
        }

        function generateDice() {
            const container = document.getElementById('diceContainer');
            const comboEl = document.getElementById('combo-display');
            container.innerHTML = '';
            container.appendChild(comboEl);

            const count = parseInt(countSelect.value);
            let sizeClass = '';
            if(count > 25) sizeClass = 'small';
            else if (count > 9) sizeClass = 'medium';

            for(let i = 0; i < count; i++) {
                let die = document.createElement('div');
                die.className = 'die ' + sizeClass;
                die.innerHTML = '<div class="dot"></div>';
                container.appendChild(die);
            }
        }

        function changeTheme() {
            const val = document.getElementById('themeSelect').value;
            document.body.className = 'theme-' + val;
        }

        function updateUnlocks() {
            const checks = [
                { id: 'opt-bronze', rolls: 10, name: 'BRONZE' },
                { id: 'opt-silver', rolls: 20, name: 'SILVER' },
                { id: 'opt-gold', rolls: 30, name: 'GOLD' }
            ];

            checks.forEach(c => {
                const opt = document.getElementById(c.id);
                if(totalRolls >= c.rolls) {
                    opt.disabled = false;
                    opt.innerHTML = c.name + ' ✅ UNLOCKED';
                } else {
                    opt.innerHTML = c.name + ' 🔒 (' + (c.rolls - totalRolls) + ' rolls left)';
                }
            });
        }

        function startRollAnimation() {
            const btn = document.getElementById('rollBtn');
            const diceElements = document.querySelectorAll('.die');
            const comboEl = document.getElementById('combo-display');

            totalRolls++;
            comboCount++;
            updateUnlocks();

            if (comboCount > 1) {
                comboEl.innerText = "COMBO x" + comboCount + " !";
                comboEl.classList.remove('show-combo');
                void comboEl.offsetWidth;
                comboEl.classList.add('show-combo');
                comboEl.style.opacity = '1';
            }

            diceElements.forEach(die => {
                die.style.backgroundColor = '#ffffff';
                die.classList.add('suspense');
                die.classList.remove('pop');
            });

            clearTimeout(spamTimeout);

            spamTimeout = setTimeout(() => {
                btn.disabled = true;

                diceElements.forEach(die => {
                    die.classList.remove('suspense');
                    const finalColor = colors[Math.floor(Math.random() * colors.length)];
                    die.style.backgroundColor = finalColor;
                    die.classList.add('pop');
                });

                comboEl.classList.remove('show-combo');
                comboEl.style.opacity = '0';
                comboCount = 0;

                setTimeout(() => {
                    btn.disabled = false;
                }, 500);

            }, 1500);
        }

        window.onload = generateDice;
    </script>
