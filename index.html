<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roll Color Dice</title>
    <style>
        body {
            background-color: #5ab2ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            overflow: hidden;
            position: relative;
            min-height: 100vh;
            margin: 0;
            padding-top: 50px;
            box-sizing: border-box;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 0px #000;
            font-size: 2.5em;
            margin-bottom: 20px;
            font-family: 'Comic Sans MS', sans-serif;
        }

        .header-right {
            position: fixed;
            top: 20px;
            right: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 200;
        }

        .server-text {
            color: white;
            font-weight: 800;
            font-size: 1.2em;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .server-text small {
            font-size: 0.6em;
            font-weight: 500;
            opacity: 0.9;
        }

        .discord-btn {
            background-color: #5865F2;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
        }

        .discord-btn:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 6px 14px rgba(0,0,0,0.4);
        }

        .discord-btn svg {
            width: 26px;
            height: 26px;
            fill: white;
        }

        .watermark {
            position: fixed;
            bottom: 15px;
            right: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95em;
            font-style: italic;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            pointer-events: none;
            z-index: 200;
        }

        .dice-container {
            display: flex;
            gap: 20px;
            margin: 30px 0;
            position: relative;
        }

        .die {
            width: 120px;
            height: 120px;
            background-color: #fff;
            border-radius: 15px;
            border: 6px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.1s;
        }

        .die .dot {
            width: 25px;
            height: 25px;
            background-color: white;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(0,0,0,0.3);
        }

        @keyframes tremble {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-3px, 3px) rotate(-3deg); }
            50% { transform: translate(3px, -3px) rotate(3deg); }
            75% { transform: translate(-3px, -3px) rotate(-2deg); }
            100% { transform: translate(3px, 3px) rotate(2deg); }
        }

        .suspense {
            animation: tremble 0.08s infinite;
            background-color: #ffffff !important;
        }

        .pop {
            transform: scale(1.2);
        }

        button#rollBtn {
            background-color: #ffd700;
            color: white;
            border: 4px solid white;
            border-radius: 8px;
            padding: 15px 50px;
            font-size: 1.8em;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            text-shadow: 1px 1px 2px #d4af37, -1px -1px 0 #d4af37, 1px -1px 0 #d4af37, -1px 1px 0 #d4af37;
            margin-bottom: 20px;
            transition: transform 0.05s;
            z-index: 10;
        }

        button#rollBtn:active {
            transform: translateY(4px) scale(0.95);
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .colors-info {
            background-color: rgba(255, 255, 255, 0.4);
            padding: 10px 20px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            font-size: 1.1em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        #combo-display {
            position: absolute;
            top: 230px;
            font-size: 5em;
            color: #ff2a2a;
            font-weight: 900;
            font-family: 'Comic Sans MS', sans-serif;
            text-transform: uppercase;
            text-shadow: 4px 4px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
        }

        .show-combo {
            animation: popCombo 0.3s forwards;
        }

        @keyframes popCombo {
            0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
            50% { opacity: 1; transform: scale(1.4) rotate(10deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
    </style>
</head>
<body>

    <div class="header-right">
        <div class="server-text">GeoMan x SM <small>with retox</small></div>
        <a href="https://discord.gg/GVkHyNvMUH" target="_blank" class="discord-btn">
            <svg viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.31,60,73.31,53s5-12.74,11.43-12.74S96.33,46,96.22,53,91.08,65.69,84.69,65.69Z"/>
            </svg>
        </a>
    </div>

    <h1>ROLL COLOR DICE</h1>

    <div class="dice-container">
        <div class="die" id="die1"><div class="dot"></div></div>
        <div class="die" id="die2"><div class="dot"></div></div>
        <div class="die" id="die3"><div class="dot"></div></div>
    </div>

    <div id="combo-display"></div>

    <button id="rollBtn" onclick="startRollAnimation()">ROLL AGAIN !</button>

    <div class="colors-info">
        Possible colors are: 
        <span style="color: #ff0000;">Red</span>, 
        <span style="color: #ffa500;">Orange</span>, 
        <span style="color: #ffff00;">Yellow</span>, 
        <span style="color: #008000;">Green</span>, 
        <span style="color: #0000ff;">Blue</span> and 
        <span style="color: #800080;">Purple</span>.
    </div>

    <div class="watermark">Created by Retox with geoman</div>

    <script>
        const colors = ['#ff0000', '#ffa500', '#ffff00', '#008000', '#0000ff', '#800080'];
        
        let rollTimeout;
        let comboTimeout;
        let comboCount = 0;

        function startRollAnimation() {
            comboCount++;
            const comboEl = document.getElementById('combo-display');
            
            if (comboCount > 1) {
                comboEl.innerText = "COMBO x" + comboCount + " !";
                comboEl.classList.remove('show-combo');
                void comboEl.offsetWidth; 
                comboEl.classList.add('show-combo');
                comboEl.style.opacity = '1';
            }

            clearTimeout(comboTimeout);
            comboTimeout = setTimeout(() => {
                comboEl.classList.remove('show-combo');
                comboEl.style.opacity = '0';
                comboCount = 0;
            }, 1500);

            for (let i = 1; i <= 3; i++) {
                const dieElement = document.getElementById('die' + i);
                dieElement.style.backgroundColor = '#ffffff'; 
                dieElement.classList.add('suspense');
            }

            clearTimeout(rollTimeout);
            rollTimeout = setTimeout(finalizeRoll, 1000); 
        }

        function finalizeRoll() {
            for (let i = 1; i <= 3; i++) {
                const dieElement = document.getElementById('die' + i);
                dieElement.classList.remove('suspense');
                
                const finalRandomIndex = Math.floor(Math.random() * colors.length);
                dieElement.style.backgroundColor = colors[finalRandomIndex];

                dieElement.classList.add('pop');
                setTimeout(() => {
                    dieElement.classList.remove('pop'); 
                }, 300);
            }
        }

        window.onload = () => {
            startRollAnimation();
            comboCount = 0; 
            document.getElementById('combo-display').style.opacity = '0';
        };
    </script>

</body>
</html>
