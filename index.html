<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roll Color Dice</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5655926023636540" crossorigin="anonymous"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            margin: 0; padding-top: 50px; min-height: 100vh;
            overflow-x: hidden; background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            transition: background-image 0.6s ease;
        }
        @keyframes gradientBG {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ══════════════════════════════════════════════
           THEMES — ordered common → rarest
        ══════════════════════════════════════════════ */
        body.theme-bw          { background-image: linear-gradient(-45deg, #1a1a1a, #3a3a3a, #000000, #2a2a2a); }
        body.theme-default     { background-image: linear-gradient(-45deg, #5ab2ff, #2980b9, #6dd5ed, #2193b0); }
        body.theme-gold        { background-image: linear-gradient(-45deg, #ffd700, #daa520, #b8860b, #ffcc00); }
        body.theme-diamond     { background-image: linear-gradient(-45deg, #00cfff, #0088ff, #4fc3f7, #0057cc); }
        body.theme-rainbow     { background-image: linear-gradient(-45deg, #ff006e, #fb5607, #ffbe0b, #8338ec, #3a86ff, #06d6a0, #ff006e); background-size: 600% 600%; animation: gradientBG 4s ease infinite; }
        body.theme-strawberry  { background-image: linear-gradient(-45deg, #ff2255, #cc0033, #ff5577, #99001a); }
        body.theme-meowl       { background-image: linear-gradient(-45deg, #ffaa00, #ff8800, #cc6600, #ffdd44); }
        body.theme-skibidi     { background-image: linear-gradient(-45deg, #c8d6e5, #8899bb, #aabbcc, #e0eaf5); }
        body.theme-candy       { background-image: linear-gradient(-45deg, #ff4da6, #ff1a8c, #cc0066, #ff88cc); }
        body.theme-lava        { background-image: linear-gradient(-45deg, #ff4500, #cc2200, #ff6600, #880000); }
        body.theme-halloween   { background-image: linear-gradient(-45deg, #ff6600, #aa3300, #1a0033, #550088); }
        body.theme-aquatic     { background-image: linear-gradient(-45deg, #005577, #003399, #0099bb, #002244); }
        body.theme-yinyang     { background-image: linear-gradient(-45deg, #ffffff, #888888, #000000, #444444); }
        body.theme-radioactive { background-image: linear-gradient(-45deg, #39ff14, #00cc00, #88ff00, #007700); }
        body.theme-taco        { background-image: linear-gradient(-45deg, #cc8800, #aa5500, #ffaa33, #773300); }
        body.theme-valentines  { background-image: linear-gradient(-45deg, #ff1166, #cc0044, #ff4488, #880022); }
        body.theme-rose        { background-image: linear-gradient(-45deg, #8b0000, #aa1111, #cc2222, #550000); }
        body.theme-stpatricks  { background-image: linear-gradient(-45deg, #006600, #009900, #33cc33, #004400); }
        body.theme-lucky       { background-image: linear-gradient(-45deg, #00cc44, #008833, #88ff44, #005522); }
        body.theme-christmas   { background-image: linear-gradient(-45deg, #cc0000, #006600, #ff2222, #009900); }
        body.theme-gingerbread { background-image: linear-gradient(-45deg, #8b4513, #a0522d, #cd853f, #5a2d0c); }
        body.theme-cursed      { background-image: linear-gradient(-45deg, #3a0000, #600000, #000000, #4a0000); }
        body.theme-divine      { background-image: linear-gradient(-45deg, #fff8dc, #ffd700, #fffacd, #cc9900); }
        body.theme-bunny       { background-image: linear-gradient(-45deg, #ffb6c1, #ff9eb5, #ffe4ec, #ff77aa); }
        body.theme-easter      { background-image: linear-gradient(-45deg, #c77dff, #9b59b6, #e0aaff, #6a0dad); }
        body.theme-cyber       { background-image: linear-gradient(-45deg, #000d1a, #002255, #0044cc, #00aaff); }
        body.theme-headless    { background-image: linear-gradient(-45deg, #06000f, #14003a, #ff4400, #06000f); }

        /* ── TITLE ── */
        h1 {
            color: white; font-size: 3em; margin-bottom: 10px;
            font-family: 'Comic Sans MS', sans-serif; letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4), 0 0 20px rgba(255,255,255,0.3);
            animation: titleFloat 3s ease-in-out infinite;
        }
        @keyframes titleFloat {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-5px); }
        }

        /* ── HEADER RIGHT ── */
        .header-right {
            position: absolute; top: 20px; right: 25px;
            display: flex; align-items: center; gap: 12px; z-index: 200;
        }
        .server-text {
            color: white; font-weight: 800; font-size: 1.2em;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
            display: flex; align-items: baseline; gap: 6px;
        }
        .server-text small { font-size: 0.6em; font-weight: 500; opacity: 0.9; }
        .discord-btn {
            background-color: #5865F2; width: 45px; height: 45px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s; text-decoration: none;
        }
        .discord-btn:hover { transform: scale(1.1) rotate(5deg); box-shadow: 0 6px 14px rgba(0,0,0,0.4); }
        .discord-btn svg { width: 26px; height: 26px; fill: white; }

        /* ── WATERMARK ── */
        .watermark {
            position: fixed; bottom: 20px; right: 25px;
            color: rgba(255,255,255,0.95);
            font-family: 'Orbitron', monospace; font-size: 1.15em; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            pointer-events: none; z-index: 200;
            animation: glowPulse 2.5s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%,100% { text-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 14px rgba(255,255,255,0.7), 0 0 28px rgba(255,255,255,0.5), 0 0 50px rgba(200,220,255,0.4); opacity:1; }
            50%      { text-shadow: 0 0 10px #fff, 0 0 22px rgba(255,255,255,0.9), 0 0 45px rgba(255,255,255,0.7), 0 0 80px rgba(200,220,255,0.6); opacity:0.85; }
        }

        /* ── CONTROLS ── */
        .controls-top {
            display: flex; gap: 14px; margin-bottom: 30px;
            padding: 14px 22px; border-radius: 16px;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.25);
            box-shadow: 0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.15);
        }
        .select-group { display: flex; flex-direction: column; gap: 5px; }
        .select-label {
            font-family: 'Orbitron', monospace; font-size: 0.58em; font-weight: 700;
            color: rgba(255,255,255,0.6); letter-spacing: 2px; text-transform: uppercase; padding-left: 4px;
        }
        .select-wrapper { position: relative; display: inline-block; }
        .select-wrapper::after {
            content: '▾'; position: absolute; right: 13px; top: 50%;
            transform: translateY(-50%); color: rgba(255,255,255,0.7);
            font-size: 1em; pointer-events: none; transition: transform 0.2s ease;
        }
        .select-wrapper:hover::after { transform: translateY(-50%) translateY(2px); }
        select {
            appearance: none; -webkit-appearance: none;
            padding: 11px 40px 11px 16px;
            font-family: 'Orbitron', monospace; font-size: 0.72em; font-weight: 700;
            letter-spacing: 1px; border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.45);
            background: rgba(255,255,255,0.12); color: #fff;
            cursor: pointer; outline: none; text-transform: uppercase;
            transition: all 0.2s ease; min-width: 230px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.18);
        }
        select:hover {
            background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.75);
            box-shadow: 0 6px 20px rgba(0,0,0,0.25), 0 0 12px rgba(255,255,255,0.15), inset 0 1px 0 rgba(255,255,255,0.25);
            transform: translateY(-1px);
        }
        select:focus { border-color: #ffd700; box-shadow: 0 0 0 3px rgba(255,215,0,0.3), 0 6px 20px rgba(0,0,0,0.25); }
        select option { background-color: #0a0a1a; color: white; font-family: 'Rajdhani', sans-serif; font-weight: 600; }
        select option:disabled { color: #555; }

        /* ── ROLL COUNTER BADGE ── */
        .roll-counter {
            font-family: 'Orbitron', monospace; font-size: 0.75em; font-weight: 700;
            color: rgba(255,255,255,0.85); background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
            padding: 6px 14px; letter-spacing: 1px; text-align: center;
            align-self: center;
        }
        .roll-counter span { color: #ffd700; font-size: 1.3em; }

        /* ── DICE ── */
        .dice-container {
            display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
            gap: 15px; margin: 20px 0; width: 90%; max-width: 900px; min-height: 150px; position: relative;
        }
        .die-wrapper { perspective: 500px; }
        .die {
            width: 100px; height: 100px; background: #ffffff; border-radius: 18px;
            border: 4px solid rgba(255,255,255,0.9);
            box-shadow: 0 8px 20px rgba(0,0,0,0.35), inset 0 2px 0 rgba(255,255,255,0.6), inset 0 -2px 0 rgba(0,0,0,0.15);
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s ease, box-shadow 0.3s ease;
            position: relative; transform-style: preserve-3d;
        }
        .die::after {
            content: ''; position: absolute; top: 0; left: 0;
            width: 55%; height: 45%; border-radius: 14px 0 50% 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.45) 0%, transparent 100%);
            pointer-events: none;
        }
        .die.medium { width: 60px; height: 60px; border-width: 3px; border-radius: 12px; }
        .die.small  { width: 40px; height: 40px; border-width: 2px; border-radius: 9px; }
        .die .dot {
            width: 26%; height: 26%; background: rgba(255,255,255,0.95); border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.55), 0 0 0 2px rgba(0,0,0,0.1);
            position: relative; z-index: 2;
        }

        @keyframes shake {
            0%   { transform: translate(0,0) rotate(0deg); }
            10%  { transform: translate(-4px, 4px) rotate(-5deg); }
            20%  { transform: translate(4px, -4px) rotate(5deg); }
            30%  { transform: translate(-4px,-4px) rotate(-3deg); }
            40%  { transform: translate(4px, 4px) rotate(3deg); }
            50%  { transform: translate(-3px, 2px) rotate(-6deg); }
            60%  { transform: translate(3px, -2px) rotate(6deg); }
            70%  { transform: translate(-2px, 3px) rotate(-4deg); }
            80%  { transform: translate(2px, -3px) rotate(4deg); }
            90%  { transform: translate(-1px, 1px) rotate(-2deg); }
            100% { transform: translate(1px, -1px) rotate(2deg); }
        }
        @keyframes flipReveal {
            0%   { transform: rotateY(0deg) scale(1); }
            40%  { transform: rotateY(90deg) scale(0.85); }
            60%  { transform: rotateY(-30deg) scale(1.15); }
            80%  { transform: rotateY(10deg) scale(1.05); }
            100% { transform: rotateY(0deg) scale(1); }
        }
        @keyframes popBounce {
            0%   { transform: scale(1); }
            30%  { transform: scale(1.35); }
            55%  { transform: scale(0.9); }
            75%  { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .die.suspense {
            animation: shake 0.1s infinite linear;
            background: #ffffff !important;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 20px rgba(255,255,255,0.3), inset 0 2px 0 rgba(255,255,255,0.6) !important;
        }
        .die.flipping { animation: flipReveal 0.5s cubic-bezier(0.25,0.46,0.45,0.94) forwards; }
        .die.popping  { animation: popBounce 0.4s cubic-bezier(0.36,0.07,0.19,0.97) forwards; }
        .die.colored {
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 30px var(--die-glow,rgba(255,255,255,0.5)), 0 0 60px var(--die-glow,rgba(255,255,255,0.2)), inset 0 2px 0 rgba(255,255,255,0.35), inset 0 -2px 0 rgba(0,0,0,0.2);
        }

        /* ── ROLL BUTTON ── */
        button#rollBtn {
            position: relative; background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: white; border: 3px solid rgba(255,255,255,0.9); border-radius: 14px;
            padding: 16px 55px; font-size: 2em; font-weight: 900;
            font-family: 'Rajdhani', sans-serif; cursor: pointer; overflow: hidden;
            transition: all 0.15s ease; z-index: 10; margin-bottom: 20px; margin-top: 30px;
            text-shadow: 0 2px 4px rgba(180,120,0,0.6);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3), inset 0 2px 0 rgba(255,255,255,0.3);
            animation: btnPulse 2s ease-in-out infinite;
        }
        @keyframes btnPulse {
            0%,100% { box-shadow: 0 6px 20px rgba(0,0,0,0.3), 0 0 0 0 rgba(255,215,0,0.5), inset 0 2px 0 rgba(255,255,255,0.3); }
            50%      { box-shadow: 0 6px 20px rgba(0,0,0,0.3), 0 0 0 14px rgba(255,215,0,0), inset 0 2px 0 rgba(255,255,255,0.3); }
        }
        button#rollBtn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
            animation: btnShine 3s ease-in-out infinite;
        }
        @keyframes btnShine { 0%{left:-100%} 40%{left:150%} 100%{left:150%} }
        button#rollBtn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 10px 30px rgba(0,0,0,0.35), 0 0 25px rgba(255,215,0,0.4); animation: none; }
        button#rollBtn:active:not(:disabled) { transform: translateY(3px) scale(0.96); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        button#rollBtn:disabled { background: linear-gradient(135deg,#555,#333); text-shadow:none; border-color:rgba(255,255,255,0.2); cursor:not-allowed; animation:none; transform:scale(0.96); box-shadow:0 2px 8px rgba(0,0,0,0.3); }
        button#rollBtn:disabled::before { display: none; }

        /* ── COMBO ── */
        #combo-display {
            position: absolute; top: -70px; left: 50%; transform: translateX(-50%);
            font-size: 4em; color: #ff2a2a; font-weight: 900; font-family: 'Comic Sans MS', sans-serif;
            text-transform: uppercase; text-shadow: 3px 3px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;
            opacity:0; pointer-events:none; z-index:100; white-space:nowrap;
        }
        @keyframes popCombo {
            0%   { opacity:0; transform:translateX(-50%) scale(0.2) rotate(-10deg); }
            50%  { opacity:1; transform:translateX(-50%) scale(1.3) rotate(4deg); }
            75%  { transform:translateX(-50%) scale(0.95) rotate(-1deg); }
            100% { opacity:1; transform:translateX(-50%) scale(1) rotate(0deg); }
        }
        .show-combo { animation: popCombo 0.4s cubic-bezier(0.36,0.07,0.19,0.97) forwards; }

        /* ── UNLOCK TOAST ── */
        #unlock-toast {
            position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-120px);
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 2px solid; border-radius: 12px;
            padding: 14px 28px; font-family: 'Orbitron', monospace;
            font-size: 0.85em; font-weight: 700; letter-spacing: 1px;
            color: white; text-align: center; z-index: 999;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        #unlock-toast.show { transform: translateX(-50%) translateY(0); }

        /* ── COLORS INFO ── */
        .colors-info {
            background: rgba(255,255,255,0.22); backdrop-filter: blur(8px);
            padding: 10px 22px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
            color: white; font-weight: 700; font-size: 1.1em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.25); margin-bottom: 20px; z-index: 10;
        }

        /* ── PARTICLE CANVAS ── */
        #particles { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

        /* ── ADS ── */
        .ad-space { display: flex; justify-content: center; align-items: center; z-index: 50; }
        .ad-side { position: fixed; top: 50%; transform: translateY(-50%); width: 160px; height: 600px; }
        .ad-left  { left: 10px; }
        .ad-right { right: 10px; }
        .ad-bottom { width: 728px; max-width: 90%; height: 90px; margin-top: 10px; margin-bottom: 30px; }
        @media (max-width: 1200px) { .ad-side { display: none; } }
    </style>
</head>

<div class="controls-top">
    <div class="select-group">
        <span class="select-label">🎨 Theme</span>
        <div class="select-wrapper">
            <select id="themeSelect" onchange="changeTheme()">
                <!-- always unlocked -->
                <option value="bw"         selected>B&W — DEFAULT</option>
                <option value="default"           >DEFAULT BLUE</option>
                <!-- unlockable — generated by JS below -->
            </select>
        </div>
    </div>
    <div class="select-group">
        <span class="select-label">🎲 Number of Dice</span>
        <div class="select-wrapper">
            <select id="diceCountSelect" onchange="generateDice()"></select>
        </div>

</div>

<script>
// ── COLORS & GLOW ────────────────────────────────────────────────
const COLORS = ['#ff0000','#ffa500','#ffff00','#008000','#0000ff','#800080'];
const GLOW   = ['rgba(255,60,60,0.8)','rgba(255,170,30,0.8)','rgba(255,255,40,0.8)',
                'rgba(30,200,60,0.8)','rgba(50,110,255,0.8)','rgba(170,50,255,0.8)'];

// ── THEME UNLOCK TABLE (ordered common → rarest) ────────────────
// Each entry = { id, label, rolls, emoji, borderColor }
const UNLOCKABLE_THEMES = [
    { id:'gold',        label:'Gold',              rolls:5,   emoji:'🟡', border:'#ffd700' },
    { id:'diamond',     label:'Diamond',           rolls:12,  emoji:'💎', border:'#00cfff' },
    { id:'rainbow',     label:'Rainbow',           rolls:20,  emoji:'🌈', border:'#ff88cc' },
    { id:'strawberry',  label:'Strawberry',        rolls:30,  emoji:'🍓', border:'#ff2255' },
    { id:'meowl',       label:'Meowl',             rolls:42,  emoji:'🦉', border:'#ffaa00' },
    { id:'skibidi',     label:'Skibidi',           rolls:55,  emoji:'🚽', border:'#aabbcc' },
    { id:'candy',       label:'Candy',             rolls:70,  emoji:'🍬', border:'#ff4da6' },
    { id:'lava',        label:'Lava',              rolls:88,  emoji:'🌋', border:'#ff4500' },
    { id:'halloween',   label:'Halloween',         rolls:108, emoji:'🎃', border:'#ff6600' },
    { id:'aquatic',     label:'Aquatic',           rolls:130, emoji:'🌊', border:'#0099bb' },
    { id:'yinyang',     label:'Yin Yang',          rolls:155, emoji:'☯️',  border:'#888888' },
    { id:'radioactive', label:'Radioactive',       rolls:183, emoji:'☢️',  border:'#39ff14' },
    { id:'taco',        label:'Taco',              rolls:214, emoji:'🌮', border:'#ffaa33' },
    { id:'valentines',  label:"Valentine's",       rolls:248, emoji:'💖', border:'#ff1166' },
    { id:'rose',        label:'Rose',              rolls:285, emoji:'🌹', border:'#cc2222' },
    { id:'stpatricks',  label:"St. Patrick's",     rolls:325, emoji:'🍀', border:'#33cc33' },
    { id:'lucky',       label:'Lucky',             rolls:368, emoji:'🍀', border:'#88ff44' },
    { id:'christmas',   label:'Christmas',         rolls:414, emoji:'🎄', border:'#ff2222' },
    { id:'gingerbread', label:'Gingerbread',       rolls:464, emoji:'🍪', border:'#cd853f' },
    { id:'cursed',      label:'Cursed',            rolls:518, emoji:'💀', border:'#600000' },
    { id:'divine',      label:'Divine',            rolls:577, emoji:'✨', border:'#ffd700' },
    { id:'bunny',       label:'Bunny Rabbit',      rolls:640, emoji:'🐰', border:'#ffb6c1' },
    { id:'easter',      label:'Easter',            rolls:707, emoji:'🥚', border:'#c77dff' },
    { id:'cyber',       label:'Cyber',             rolls:780, emoji:'🤖', border:'#00aaff' },
    { id:'headless',    label:'Headless Horseman', rolls:999, emoji:'🎃', border:'#ff4400' },
];

let totalRolls = 0;
let comboCount = 0;
let spamTimeout;
let toastTimer;

// ── BUILD THEME SELECT ───────────────────────────────────────────
const themeSelect = document.getElementById('themeSelect');
UNLOCKABLE_THEMES.forEach(t => {
    const opt = document.createElement('option');
    opt.value    = t.id;
    opt.id       = 'opt-' + t.id;
    opt.disabled = true;
    opt.textContent = `${t.emoji} ${t.label} 🔒 — ${t.rolls} ROLLS`;
    themeSelect.appendChild(opt);
});

// ── DICE COUNT SELECT ────────────────────────────────────────────
const countSelect = document.getElementById('diceCountSelect');
for (let i = 1; i <= 50; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i + (i === 1 ? ' DIE' : ' DICE');
    if (i === 3) opt.selected = true;
    countSelect.appendChild(opt);
}

// ── GENERATE DICE ────────────────────────────────────────────────
function generateDice() {
    const container = document.getElementById('diceContainer');
    const comboEl   = document.getElementById('combo-display');
    container.innerHTML = '';
    container.appendChild(comboEl);
    const count = parseInt(countSelect.value);
    const sz = count > 25 ? 'small' : count > 9 ? 'medium' : '';
    for (let i = 0; i < count; i++) {
        const w = document.createElement('div'); w.className = 'die-wrapper';
        const d = document.createElement('div'); d.className = 'die ' + sz;
        d.innerHTML = '<div class="dot"></div>';
        w.appendChild(d); container.appendChild(w);
    }
}

// ── CHANGE THEME ─────────────────────────────────────────────────
function changeTheme() {
    document.body.className = 'theme-' + themeSelect.value;
}

// ── UNLOCK THEMES ────────────────────────────────────────────────
function updateUnlocks() {
    document.getElementById('rollCount').textContent = totalRolls;
    UNLOCKABLE_THEMES.forEach(t => {
        const opt = document.getElementById('opt-' + t.id);
        if (!opt) return;
        if (totalRolls >= t.rolls) {
            if (opt.disabled) {
                // Just unlocked!
                opt.disabled = false;
                showUnlockToast(t);
            }
            opt.textContent = `${t.emoji} ${t.label} ✅`;
        } else {
            opt.textContent = `${t.emoji} ${t.label} 🔒 — ${t.rolls - totalRolls} rolls left`;
        }
    });
}

// ── TOAST NOTIFICATION ───────────────────────────────────────────
function showUnlockToast(t) {
    const toast = document.getElementById('unlock-toast');
    toast.style.borderColor = t.border;
    toast.style.boxShadow   = `0 10px 40px rgba(0,0,0,0.5), 0 0 20px ${t.border}88`;
    toast.innerHTML = `${t.emoji} THEME UNLOCKED: <span style="color:${t.border}">${t.label.toUpperCase()}</span> ${t.emoji}`;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
}

// ── PARTICLES ────────────────────────────────────────────────────
const canvas = document.getElementById('particles');
const ctx    = canvas.getContext('2d');
let particles = [];
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas(); window.addEventListener('resize', resizeCanvas);

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        particles.push({ x, y,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 3,
            radius: 4 + Math.random() * 5, color, alpha: 1,
            decay: 0.02 + Math.random() * 0.02, gravity: 0.15
        });
    }
}
function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles = particles.filter(p => p.alpha > 0);
    particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.vx *= 0.98; p.alpha -= p.decay;
        ctx.save(); ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 8;
        ctx.fill(); ctx.restore();
    });
    requestAnimationFrame(animateParticles);
}
animateParticles();

// ── ROLL ANIMATION ───────────────────────────────────────────────
function startRollAnimation() {
    const btn     = document.getElementById('rollBtn');
    const dies    = document.querySelectorAll('.die');
    const comboEl = document.getElementById('combo-display');

    totalRolls++; comboCount++;
    updateUnlocks();

    if (comboCount > 1) {
        comboEl.textContent = 'COMBO x' + comboCount + ' !';
        comboEl.classList.remove('show-combo');
        void comboEl.offsetWidth;
        comboEl.classList.add('show-combo');
        comboEl.style.opacity = '1';
    }

    dies.forEach(die => {
        die.classList.remove('flipping','popping','colored');
        die.style.background = '';
        die.style.setProperty('--die-glow','');
        void die.offsetWidth;
        die.classList.add('suspense');
    });

    clearTimeout(spamTimeout);
    spamTimeout = setTimeout(() => {
        btn.disabled = true;
        dies.forEach((die, i) => {
            setTimeout(() => {
                const ci    = Math.floor(Math.random() * COLORS.length);
                const color = COLORS[ci];
                const glow  = GLOW[ci];
                die.classList.remove('suspense');
                die.style.background = color;
                die.style.setProperty('--die-glow', glow);
                die.classList.add('colored');
                const anim = Math.random() > 0.4 ? 'flipping' : 'popping';
                die.classList.add(anim);
                die.addEventListener('animationend', () => die.classList.remove(anim), { once: true });
                const rect = die.getBoundingClientRect();
                spawnParticles(rect.left + rect.width/2, rect.top + rect.height/2, color, dies.length <= 10 ? 18 : 8);
            }, i * (dies.length > 20 ? 30 : 60));
        });
        comboEl.classList.remove('show-combo');
        comboEl.style.opacity = '0';
        comboCount = 0;
        const totalDelay = dies.length * (dies.length > 20 ? 30 : 60) + 600;
        setTimeout(() => { btn.disabled = false; }, totalDelay);
    }, 1500);
}

// ── INIT ─────────────────────────────────────────────────────────
window.onload = generateDice;
</script>
