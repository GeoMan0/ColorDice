<head>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5655926023636540" crossorigin="anonymous"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            margin: 0; padding-top: 50px; min-height: 100vh;
            overflow-x: hidden; background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            transition: background-image 0.6s ease;
        }
        @keyframes gradientBG {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ══ THEMES ══ */
        body.theme-bw         { background-image: linear-gradient(-45deg, #1a1a1a, #3a3a3a, #000000, #2a2a2a); }
        body.theme-silver     { background-image: linear-gradient(-45deg, #bdc3c7, #2c3e50, #8e9eab, #eef2f3); }
        body.theme-neon-tokyo { background-image: linear-gradient(-45deg, #0d0221, #7b2fff, #ff006e, #0d0221); background-size:600% 600%; animation: gradientBG 6s ease infinite; }
        body.theme-ocean      { background-image: linear-gradient(-45deg, #001233, #0077b6, #00b4d8, #023e8a); }
        body.theme-volcano    { background-image: linear-gradient(-45deg, #1a0000, #8b0000, #ff2200, #ff6600); background-size:600% 600%; animation: gradientBG 5s ease infinite; }
        body.theme-galaxy     { background-image: linear-gradient(-45deg, #0d001a, #4a0080, #cc00ff, #050010); background-size:600% 600%; animation: gradientBG 7s ease infinite; }

        h1 {
            color: white; font-size: 3em; margin-bottom: 10px;
            font-family: 'Comic Sans MS', sans-serif; letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4), 0 0 20px rgba(255,255,255,0.3);
            animation: titleFloat 3s ease-in-out infinite;
        }
        @keyframes titleFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* ── INDICATEURS top-left (Sans API) ── */
        .user-counter {
            position: absolute; top: 20px; left: 25px;
            background: rgba(0,0,0,0.45); backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.18); border-radius: 12px;
            padding: 10px 16px; z-index: 200;
        }
        .ucl { font-family: 'Orbitron', monospace; font-size: 0.6em; font-weight: 700; color: rgba(255,255,255,0.8); display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .dot-live { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 6px #00ff88; animation: livePulse 1.5s infinite; }
        @keyframes livePulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } }

        /* ── HEADER RIGHT ── */
        .header-right { position: absolute; top: 20px; right: 25px; display: flex; align-items: center; gap: 12px; z-index: 200; }
        .server-text { color: white; font-weight: 800; font-size: 1.2em; }
        .discord-btn { background-color: #5865F2; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .discord-btn svg { width: 26px; height: 26px; fill: white; }

        /* ── CONTROLS ── */
        .controls-top { display: flex; gap: 14px; margin-bottom: 30px; padding: 14px 22px; border-radius: 16px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.25); }
        .select-group { display: flex; flex-direction: column; gap: 5px; }
        .select-label { font-family: 'Orbitron', monospace; font-size: 0.58em; color: rgba(255,255,255,0.6); text-transform: uppercase; }
        select { background: rgba(255,255,255,0.12); color: white; border: 2px solid rgba(255,255,255,0.45); border-radius: 10px; padding: 8px; font-family: 'Orbitron'; }

        .roll-counter { font-family: 'Orbitron', monospace; font-size: 0.75em; color: white; align-self: center; }
        .roll-counter span { color: #ffd700; font-size: 1.3em; }

        /* ── DICE ── */
        .dice-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin: 20px 0; width: 90%; max-width: 900px; min-height: 150px; position: relative; }
        .die { width: 100px; height: 100px; background: white; border-radius: 18px; border: 4px solid white; display: flex; justify-content: center; align-items: center; transition: all 0.4s; position: relative; }
        .die.medium { width: 60px; height: 60px; }
        .die.small { width: 40px; height: 40px; }
        .die .dot { width: 26%; height: 26%; background: rgba(255,255,255,0.9); border-radius: 50%; }

        @keyframes shake { 0%{transform:translate(0,0)} 20%{transform:translate(-4px,4px)} 40%{transform:translate(4px,-4px)} 60%{transform:translate(-4px,-4px)} 80%{transform:translate(4px,4px)} 100%{transform:translate(0,0)} }
        .die.suspense { animation: shake 0.1s infinite; }
        .die.colored { box-shadow: 0 0 30px var(--die-glow); }

        button#rollBtn { background: linear-gradient(135deg,#ffd700,#ffaa00); color: white; border: 3px solid white; border-radius: 14px; padding: 16px 55px; font-size: 2em; font-weight: 900; cursor: pointer; }

        #combo-display { position: absolute; top: -70px; left: 50%; transform: translateX(-50%); font-size: 4em; color: #ff2a2a; font-weight: 900; opacity:0; pointer-events:none; }
        .show-combo { animation: pop 0.4s forwards; }
        @keyframes pop { 0%{opacity:0; transform:translateX(-50%) scale(0.5)} 100%{opacity:1; transform:translateX(-50%) scale(1)} }

        #unlock-toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-120px); background: #1a1a2e; border: 2px solid white; border-radius: 12px; padding: 14px; color: white; transition: 0.4s; z-index: 999; }
        #unlock-toast.show { transform: translateX(-50%) translateY(0); }

        .watermark { position: fixed; bottom: 20px; right: 25px; color: white; font-family: 'Orbitron'; font-size: 1.1em; opacity: 0.8; }
        #particles { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

        .ad-space { display: flex; justify-content: center; align-items: center; }
        .ad-side { position: fixed; top: 50%; transform: translateY(-50%); width: 160px; height: 600px; }
        .ad-left { left: 10px; } .ad-right { right: 10px; }
    </style>
</head>
<body class="theme-bw">

<div class="header-right">
    <div class="server-text">GeoMan x SM <small>with retox</small></div>

<h1>ROLL COLOR DICE</h1>

<div class="controls-top">
    <div class="select-group">
        <span class="select-label">🎨 Theme</span>
        <select id="themeSelect" onchange="changeTheme()">
            <option value="bw" selected>⬛ B&W — DEFAULT</option>
        </select>
    </div>
    <div class="select-group">
        <span class="select-label">🎲 Number of Dice</span>
        <select id="diceCountSelect" onchange="generateDice()"></select>
    </div>
    <div class="roll-counter">ROLLS : <span id="rollCount">0</span></div>
</div>

<div class="dice-container" id="diceContainer">
    <div id="combo-display"></div>
</div>

<button id="rollBtn" onclick="startRollAnimation()">ROLL AGAIN !</button>

<div class="watermark">Created by Retox & Geoman</div>

<script>
const COLORS = ['#ff0000','#ffa500','#ffff00','#008000','#0000ff','#800080'];
const GLOW   = ['rgba(255,60,60,0.8)','rgba(255,170,30,0.8)','rgba(255,255,40,0.8)','rgba(30,200,60,0.8)','rgba(50,110,255,0.8)','rgba(170,50,255,0.8)'];

const UNLOCKABLE_THEMES = [
    { id:'silver', label:'Silver', rolls:20, emoji:'🥈', border:'#bdc3c7' },
    { id:'neon-tokyo', label:'Neon Tokyo', rolls:10, emoji:'🗼', border:'#ff006e' },
    { id:'ocean', label:'Deep Ocean', rolls:30, emoji:'🌊', border:'#00b4d8' },
    { id:'volcano', label:'Volcano', rolls:75, emoji:'🌋', border:'#ff2200' },
    { id:'galaxy', label:'Galaxy', rolls:150, emoji:'🌠', border:'#cc00ff' },
];

let totalRolls = 0, comboCount = 0, spamTimeout;

// Init selects
const themeSelect = document.getElementById('themeSelect');
UNLOCKABLE_THEMES.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.id; opt.id = 'opt-' + t.id; opt.disabled = true;
    opt.textContent = `${t.emoji} ${t.label} 🔒 — ${t.rolls} ROLLS`;
    themeSelect.appendChild(opt);
});

const countSelect = document.getElementById('diceCountSelect');
for (let i = 1; i <= 50; i++) {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = i + (i === 1 ? ' DIE' : ' DICE');
    if (i === 3) opt.selected = true;
    countSelect.appendChild(opt);
}

function generateDice() {
    const container = document.getElementById('diceContainer');
    const comboEl = document.getElementById('combo-display');
    container.innerHTML = ''; container.appendChild(comboEl);
    const count = parseInt(countSelect.value);
    const sz = count > 25 ? 'small' : count > 9 ? 'medium' : '';
    for (let i = 0; i < count; i++) {
        const d = document.createElement('div'); d.className = 'die ' + sz;
        d.innerHTML = '<div class="dot"></div>';
        container.appendChild(d);
    }
}

function changeTheme() { document.body.className = 'theme-' + themeSelect.value; }

function updateUnlocks() {
    document.getElementById('rollCount').textContent = totalRolls;
    UNLOCKABLE_THEMES.forEach(t => {
        const opt = document.getElementById('opt-' + t.id);
        if (totalRolls >= t.rolls) {
            opt.disabled = false;
            opt.textContent = `${t.emoji} ${t.label} ✅`;
        }
    });
}

// PARTICLES
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.onresize = resize; resize();

function spawnParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
        particles.push({ x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, alpha: 1, color });
    }
}
function render() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach((p,i) => {
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
        ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
        ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fill();
        if(p.alpha <= 0) particles.splice(i,1);
    });
    requestAnimationFrame(render);
}
render();

function startRollAnimation() {
    const btn = document.getElementById('rollBtn');
    const dies = document.querySelectorAll('.die');
    const comboEl = document.getElementById('combo-display');
    
    totalRolls++; comboCount++; updateUnlocks();
    
    if (comboCount > 1) {
        comboEl.textContent = 'COMBO x'+comboCount+' !';
        comboEl.classList.add('show-combo'); comboEl.style.opacity='1';
    }

    dies.forEach(die => {
        die.classList.add('suspense');
        die.style.background = 'white';
    });

    btn.disabled = true;
    setTimeout(() => {
        dies.forEach(die => {
            const ci = Math.floor(Math.random()*COLORS.length);
            die.classList.remove('suspense');
            die.style.background = COLORS[ci];
            die.style.setProperty('--die-glow', GLOW[ci]);
            die.classList.add('colored');
            const r = die.getBoundingClientRect();
            spawnParticles(r.left + r.width/2, r.top + r.height/2, COLORS[ci]);
        });
        btn.disabled = false;
        comboEl.style.opacity='0'; comboEl.classList.remove('show-combo');
    }, 1000);
}

window.onload = generateDice;
</script>
</body>
</html>
